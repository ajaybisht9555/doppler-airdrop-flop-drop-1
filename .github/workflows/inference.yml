name: Airdrop Farmer
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  farm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: node worker.mjs
        env:
          PASSPHRASE: Technocore-Farm-1789796861356
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
